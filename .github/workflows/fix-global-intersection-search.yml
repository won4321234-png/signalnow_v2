name: Apply global intersection search fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Patch source
        shell: python
        run: |
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'anchor missing: {path}: {old[:120]}')
              p.write_text(s.replace(old,new,1))

          # SearchPanel: use full dataset, load lazily, stage selection, then Done.
          r('src/components/SearchPanel.tsx','import { Car, Footprints, MapPin, Search, X } from "lucide-react";','import { Car, Check, Footprints, MapPin, Search, X } from "lucide-react";')
          r('src/components/SearchPanel.tsx','  intersections?: Intersection[];\n  onSelect?: (intersectionId: string) => void;','  intersections?: Intersection[];\n  searchIntersections?: Intersection[];\n  searchLoading?: boolean;\n  searchReady?: boolean;\n  onLoadSearchIntersections?: () => void;\n  onSelect?: (intersectionId: string) => void;')
          r('src/components/SearchPanel.tsx','export function SearchPanel({ mode, onModeChange, intersections = [], onSelect, modeOnly = false, region, regions, onRegionChange }: SearchPanelProps) {','export function SearchPanel({ mode, onModeChange, intersections = [], searchIntersections = [], searchLoading = false, searchReady = false, onLoadSearchIntersections, onSelect, modeOnly = false, region, regions, onRegionChange }: SearchPanelProps) {')
          r('src/components/SearchPanel.tsx','!modeOnly && onSelect && <SearchInput intersections={intersections} onSelect={onSelect} />','!modeOnly && onSelect && <SearchInput intersections={intersections} searchIntersections={searchIntersections} searchLoading={searchLoading} searchReady={searchReady} onLoadSearchIntersections={onLoadSearchIntersections} onSelect={onSelect} />')
          r('src/components/SearchPanel.tsx','function SearchInput({ intersections, onSelect }: { intersections: Intersection[]; onSelect: (id: string) => void }) {','function SearchInput({ searchIntersections, searchLoading, searchReady, onLoadSearchIntersections, onSelect }: { intersections: Intersection[]; searchIntersections: Intersection[]; searchLoading: boolean; searchReady: boolean; onLoadSearchIntersections?: () => void; onSelect: (id: string) => void }) {')
          r('src/components/SearchPanel.tsx','  const [open, setOpen] = useState(false);\n  const containerRef = useRef<HTMLDivElement>(null);','  const [open, setOpen] = useState(false);\n  const [pendingId, setPendingId] = useState<string | null>(null);\n  const containerRef = useRef<HTMLDivElement>(null);\n  const loadRequestedRef = useRef(false);')
          r('src/components/SearchPanel.tsx','  const results = query.trim().length === 0 ? [] : intersections.filter((i) => i.crsrdNm.toLowerCase().includes(query.trim().toLowerCase()));\n  const handleSelect = (id: string) => { onSelect(id); setQuery(""); setOpen(false); };','  useEffect(() => { if (!query.trim() || searchReady || searchLoading || loadRequestedRef.current || !onLoadSearchIntersections) return; loadRequestedRef.current = true; onLoadSearchIntersections(); }, [query, searchReady, searchLoading, onLoadSearchIntersections]);\n  useEffect(() => { if (searchReady) loadRequestedRef.current = false; }, [searchReady]);\n  const normalizedQuery = query.trim().toLowerCase();\n  const results = normalizedQuery.length === 0 || !searchReady ? [] : searchIntersections.filter((i) => i.crsrdNm.toLowerCase().includes(normalizedQuery));\n  const handleSelect = (id: string) => { setPendingId(id); setOpen(true); };\n  const handleDone = () => { if (!pendingId) return; onSelect(pendingId); setPendingId(null); setQuery(""); setOpen(false); };')
          r('src/components/SearchPanel.tsx','onChange={(e) => { setQuery(e.target.value); setOpen(true); }}','onChange={(e) => { setQuery(e.target.value); setPendingId(null); setOpen(true); }}')
          r('src/components/SearchPanel.tsx','{open && results.length > 0 && <div className="animate-dropdown-in absolute left-0 right-0 top-full mt-2 overflow-hidden rounded-2xl border border-border/20 bg-card elevation-5" role="listbox"><ul className="max-h-64 overflow-y-auto py-1">{results.map((intersection) => <li key={intersection.crsrdId}><button type="button" onClick={() => handleSelect(intersection.crsrdId)} className="flex w-full items-center gap-3 px-3.5 py-2.5 text-left transition-colors duration-150 hover:bg-accent/50"><span className="flex size-8 shrink-0 items-center justify-center rounded-lg bg-muted text-muted-foreground"><MapPin className="size-4" /></span><div className="flex min-w-0 flex-col gap-0.5"><span className="truncate text-sm font-semibold text-foreground">{intersection.crsrdNm}</span><span className="truncate font-mono text-[10px] text-muted-foreground">{intersection.crsrdId}</span></div></button></li>)}</ul></div>}','{open && query.trim() && <div className="animate-dropdown-in absolute left-0 right-0 top-full mt-2 overflow-hidden rounded-2xl border border-border/20 bg-card elevation-5" role="listbox">{searchLoading ? <div className="px-4 py-4 text-xs font-semibold text-muted-foreground">전체 교차로 데이터를 불러오는 중…</div> : !searchReady ? <div className="px-4 py-4 text-xs font-semibold text-muted-foreground">검색 데이터를 준비하는 중…</div> : results.length === 0 ? <div className="px-4 py-4 text-xs font-semibold text-muted-foreground">검색 결과가 없습니다</div> : <ul className="max-h-64 overflow-y-auto py-1">{results.map((intersection) => <li key={intersection.crsrdId}><button type="button" onClick={() => handleSelect(intersection.crsrdId)} className={cn("flex w-full items-center gap-3 px-3.5 py-2.5 text-left transition-colors duration-150 hover:bg-accent/50", pendingId === intersection.crsrdId && "bg-accent/60")}><span className="flex size-8 shrink-0 items-center justify-center rounded-lg bg-muted text-muted-foreground"><MapPin className="size-4" /></span><div className="flex min-w-0 flex-col gap-0.5"><span className="truncate text-sm font-semibold text-foreground">{intersection.crsrdNm}</span><span className="truncate font-mono text-[10px] text-muted-foreground">{intersection.crsrdId}</span></div></button></li>)}</ul>}{pendingId && <div className="flex items-center justify-between gap-2 border-t border-border/20 bg-muted/30 p-2"><span className="truncate px-1 text-[10px] font-semibold text-muted-foreground">선택됨 · 완료를 눌러 이동</span><button type="button" onClick={handleDone} className="inline-flex shrink-0 items-center gap-1 rounded-lg bg-primary px-3 py-1.5 text-xs font-bold text-primary-foreground"><Check className="size-3.5" />완료</button></div>}</div>}')

          # Header desktop search gets the same full dataset + Done behavior.
          r('src/components/Header.tsx','import { MapPin, Search, TrafficCone, X } from "lucide-react";','import { Check, MapPin, Search, TrafficCone, X } from "lucide-react";')
          r('src/components/Header.tsx','interface HeaderProps { onLoginClick: () => void; onProfileClick: () => void; floating?: boolean; intersections?: Intersection[]; onSelectIntersection?: (id: string) => void; sidePanelOpen?: boolean; }','interface HeaderProps { onLoginClick: () => void; onProfileClick: () => void; floating?: boolean; intersections?: Intersection[]; searchIntersections?: Intersection[]; searchLoading?: boolean; searchReady?: boolean; onLoadSearchIntersections?: () => void; onSelectIntersection?: (id: string) => void; sidePanelOpen?: boolean; }')
          r('src/components/Header.tsx','export function Header({ onLoginClick, onProfileClick, floating = false, intersections = [], onSelectIntersection, sidePanelOpen = false }: HeaderProps) {','export function Header({ onLoginClick, onProfileClick, floating = false, intersections = [], searchIntersections = [], searchLoading = false, searchReady = false, onLoadSearchIntersections, onSelectIntersection, sidePanelOpen = false }: HeaderProps) {')
          r('src/components/Header.tsx','<HeaderSearch intersections={intersections} onSelect={onSelectIntersection} />','<HeaderSearch searchIntersections={searchIntersections} searchLoading={searchLoading} searchReady={searchReady} onLoadSearchIntersections={onLoadSearchIntersections} onSelect={onSelectIntersection} />')
          r('src/components/Header.tsx','function HeaderSearch({ intersections, onSelect }: { intersections: Intersection[]; onSelect: (id: string) => void }) {','function HeaderSearch({ searchIntersections, searchLoading, searchReady, onLoadSearchIntersections, onSelect }: { searchIntersections: Intersection[]; searchLoading: boolean; searchReady: boolean; onLoadSearchIntersections?: () => void; onSelect: (id: string) => void }) {')
          r('src/components/Header.tsx','const [query, setQuery] = useState(""); const [open, setOpen] = useState(false); const containerRef = useRef<HTMLDivElement>(null);','const [query, setQuery] = useState(""); const [open, setOpen] = useState(false); const [pendingId, setPendingId] = useState<string | null>(null); const containerRef = useRef<HTMLDivElement>(null); const loadRequestedRef = useRef(false);')
          r('src/components/Header.tsx','const results = query.trim().length === 0 ? [] : intersections.filter((i) => i.crsrdNm.toLowerCase().includes(query.trim().toLowerCase()));\n  const handleSelect = (id: string) => { onSelect(id); setQuery(""); setOpen(false); };','useEffect(() => { if (!query.trim() || searchReady || searchLoading || loadRequestedRef.current || !onLoadSearchIntersections) return; loadRequestedRef.current = true; onLoadSearchIntersections(); }, [query, searchReady, searchLoading, onLoadSearchIntersections]);\n  useEffect(() => { if (searchReady) loadRequestedRef.current = false; }, [searchReady]);\n  const normalizedQuery = query.trim().toLowerCase(); const results = normalizedQuery.length === 0 || !searchReady ? [] : searchIntersections.filter((i) => i.crsrdNm.toLowerCase().includes(normalizedQuery));\n  const handleSelect = (id: string) => { setPendingId(id); setOpen(true); };\n  const handleDone = () => { if (!pendingId) return; onSelect(pendingId); setPendingId(null); setQuery(""); setOpen(false); };')
          r('src/components/Header.tsx','setQuery(e.target.value); setOpen(true);','setQuery(e.target.value); setPendingId(null); setOpen(true);')
          r('src/components/Header.tsx','{open && results.length > 0 && <div className="animate-dropdown-in absolute left-0 right-0 top-full z-10 mt-2 overflow-hidden rounded-2xl border border-border/30 bg-card elevation-5"><ul className="max-h-64 overflow-y-auto py-1">{results.map((i) => <li key={i.crsrdId}><button type="button" onClick={() => handleSelect(i.crsrdId)} className="flex w-full items-center gap-3 px-4 py-2.5 text-left hover:bg-accent/50"><span className="flex size-8 items-center justify-center rounded-lg bg-muted text-muted-foreground"><MapPin className="size-4" /></span><span className="truncate text-sm font-semibold text-foreground">{i.crsrdNm}</span></button></li>)}</ul></div>}','{open && query.trim() && <div className="animate-dropdown-in absolute left-0 right-0 top-full z-10 mt-2 overflow-hidden rounded-2xl border border-border/30 bg-card elevation-5">{searchLoading ? <div className="px-5 py-4 text-sm font-medium text-muted-foreground">전체 교차로 데이터를 불러오는 중…</div> : !searchReady ? <div className="px-5 py-4 text-sm font-medium text-muted-foreground">검색 데이터를 준비하는 중…</div> : results.length === 0 ? <div className="px-5 py-4 text-sm font-medium text-muted-foreground">검색 결과가 없습니다</div> : <ul className="max-h-64 overflow-y-auto py-1">{results.map((i) => <li key={i.crsrdId}><button type="button" onClick={() => handleSelect(i.crsrdId)} className={cn("flex w-full items-center gap-3 px-4 py-2.5 text-left hover:bg-accent/50", pendingId === i.crsrdId && "bg-accent/60")}><span className="flex size-8 items-center justify-center rounded-lg bg-muted text-muted-foreground"><MapPin className="size-4" /></span><span className="truncate text-sm font-semibold text-foreground">{i.crsrdNm}</span></button></li>)}</ul>}{pendingId && <div className="flex items-center justify-between gap-2 border-t border-border/20 bg-muted/30 p-2"><span className="truncate px-1 text-[10px] font-semibold text-muted-foreground">선택됨 · 완료를 눌러 이동</span><button type="button" onClick={handleDone} className="inline-flex shrink-0 items-center gap-1 rounded-lg bg-primary px-3 py-1.5 text-xs font-bold text-primary-foreground"><Check className="size-3.5" />완료</button></div>}</div>}')

          # App: separate full search dataset from viewport marker state.
          r('src/App.tsx','const [intersections, setIntersections] = useState<Intersection[]>([]);\n  const [status, setStatus] = useState<DataStatus>("idle");','const [intersections, setIntersections] = useState<Intersection[]>([]);\n  const [searchIntersections, setSearchIntersections] = useState<Intersection[]>([]);\n  const [searchLoading, setSearchLoading] = useState(false);\n  const [searchReady, setSearchReady] = useState(false);\n  const searchRequestRef = useRef(0);\n  const [status, setStatus] = useState<DataStatus>("idle");')
          r('src/App.tsx','setIntersections([]);\n    setStatus("idle");','setIntersections([]);\n    setSearchIntersections([]);\n    setSearchLoading(false);\n    setSearchReady(false);\n    searchRequestRef.current += 1;\n    setStatus("idle");')
          r('src/App.tsx','const handleViewportChange = useCallback(async (viewport: Viewport) => {','const handleLoadSearchIntersections = useCallback(async () => {\n    if (searchLoading || searchReady) return;\n    const requestId = ++searchRequestRef.current;\n    const requestedRegion = regionId;\n    setSearchLoading(true);\n    try {\n      const all = await loadIntersectionsForViewport({ south: 0, west: 0, north: 0, east: 0 }, { loadAll: true });\n      if (requestId !== searchRequestRef.current || requestedRegion !== regionId) return;\n      const hydrated = all.map((intersection) => { const cachedSignals = signalDataRef.current.get(intersection.crsrdId); return cachedSignals ? { ...intersection, signals: cachedSignals } : intersection; });\n      setSearchIntersections(hydrated);\n      setSearchReady(true);\n      debugLog("global search dataset ready", { region: regionId, datasetCount: hydrated.length });\n    } catch (error) { if (requestId === searchRequestRef.current) console.error("[SignalNow] 전체 교차로 검색 데이터 로딩 실패", error); } finally { if (requestId === searchRequestRef.current) setSearchLoading(false); }\n  }, [regionId, searchLoading, searchReady]);\n\n  const handleViewportChange = useCallback(async (viewport: Viewport) => {')
          r('src/App.tsx','const intersection = intersections.find((item) => item.crsrdId === selectedId) ?? null;\n    if (!intersection) return null;','const intersection = intersections.find((item) => item.crsrdId === selectedId) ?? searchIntersections.find((item) => item.crsrdId === selectedId) ?? null;\n    if (!intersection) return null;')
          r('src/App.tsx','}, [selectedId, intersections, countdownNow]);','}, [selectedId, intersections, searchIntersections, countdownNow]);')
          r('src/App.tsx','<Header sidePanelOpen={sheetOpen} onLoginClick={handleLoginClick} onProfileClick={handleProfileClick} floating intersections={intersections} onSelectIntersection={handleSelectIntersection} />','<Header sidePanelOpen={sheetOpen} onLoginClick={handleLoginClick} onProfileClick={handleProfileClick} floating intersections={intersections} searchIntersections={searchIntersections} searchLoading={searchLoading} searchReady={searchReady} onLoadSearchIntersections={handleLoadSearchIntersections} onSelectIntersection={handleSelectIntersection} />')
          r('src/App.tsx','<SearchPanel mode={viewMode} onModeChange={setViewMode} intersections={intersections} onSelect={handleSelectIntersection} region={region}','<SearchPanel mode={viewMode} onModeChange={setViewMode} intersections={intersections} searchIntersections={searchIntersections} searchLoading={searchLoading} searchReady={searchReady} onLoadSearchIntersections={handleLoadSearchIntersections} onSelect={handleSelectIntersection} region={region}')

          # KakaoMap: focus a selected result even when it was outside the previous viewport.
          r('src/components/map/KakaoMap.tsx','const entry = overlaysRef.current.get(current); const intersection = intersections.find((item) => item.crsrdId === current); if (entry && intersection) { updateMarkerState(entry.element, true, favoriteIds.has(current), intersection, viewMode); entry.overlay.setZIndex(20); mapRef.current?.panTo(new kakao.maps.LatLng(intersection.mapCtptIntLat, intersection.mapCtptIntLot)); }','const entry = overlaysRef.current.get(current); const intersection = intersections.find((item) => item.crsrdId === current); const target = intersection ?? (selectedIntersectionId === selectedIntersection?.crsrdId ? selectedIntersection : null); if (entry && intersection) { updateMarkerState(entry.element, true, favoriteIds.has(current), intersection, viewMode); entry.overlay.setZIndex(20); } if (target) { const map = mapRef.current; map?.panTo(new kakao.maps.LatLng(target.mapCtptIntLat, target.mapCtptIntLot)); if (map?.getLevel && map.getLevel() > 5) map.setLevel(5); }')
          r('src/components/map/KakaoMap.tsx','[selectedIntersectionId, intersections, favoriteIds, viewMode]);','[selectedIntersectionId, selectedIntersection, intersections, favoriteIds, viewMode]);')

          # Self-delete after patching so this helper cannot run again on the commit it creates.
          Path('.github/workflows/fix-global-intersection-search.yml').unlink()
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff -- src/App.tsx src/components/SearchPanel.tsx src/components/Header.tsx src/components/map/KakaoMap.tsx
          git add src/App.tsx src/components/SearchPanel.tsx src/components/Header.tsx src/components/map/KakaoMap.tsx .github/workflows/fix-global-intersection-search.yml
          git diff --cached --check
          git commit -m "fix: search all intersections and focus selected result"
          git push origin main
