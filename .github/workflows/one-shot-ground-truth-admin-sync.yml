name: one-shot-ground-truth-admin-sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: sync admin ground truth intersections with user map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal admin full-load patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/IntersectionGroundTruthEditorV2.tsx')
          text = path.read_text()
          old = 'east: next.center.lng + span }); if (request !== requestRef.current) return; setIntersections(items);'
          new = 'east: next.center.lng + span }, { loadAll: true }); if (request !== requestRef.current) return; setIntersections(items);'
          if old not in text:
              raise SystemExit('Expected Ground Truth loadRegion call not found; refusing to patch.')
          if new in text:
              raise SystemExit('Patch already present; refusing duplicate change.')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/pages/IntersectionGroundTruthEditorV2.tsx
          rm .github/workflows/one-shot-ground-truth-admin-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/IntersectionGroundTruthEditorV2.tsx .github/workflows/one-shot-ground-truth-admin-sync.yml
          git commit -m 'fix: sync admin ground truth intersections with user map'
          git push origin main
