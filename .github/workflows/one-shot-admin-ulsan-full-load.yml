name: one-shot-admin-ulsan-full-load
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: show all Ulsan intersections in ground truth admin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal admin full-load patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/IntersectionGroundTruthEditorV2.tsx')
          text = path.read_text()
          old = 'east: next.center.lng + span }); if (request !== requestRef.current) return; setIntersections(items);'
          new = 'east: next.center.lng + span }, { loadAll: true }); if (request !== requestRef.current) return; setIntersections(items);'
          if new in text:
              print('Patch already present')
          elif old in text:
              path.write_text(text.replace(old, new, 1))
              print('Applied admin loadAll patch')
          else:
              raise SystemExit('Expected Ground Truth loadRegion call not found; refusing to patch.')
          PY
          grep -F 'east: next.center.lng + span }, { loadAll: true })' src/pages/IntersectionGroundTruthEditorV2.tsx
          npm ci
          npm run typecheck
          npm run build
          git diff --check
          git diff -- src/pages/IntersectionGroundTruthEditorV2.tsx
          rm .github/workflows/one-shot-admin-ulsan-full-load.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/IntersectionGroundTruthEditorV2.tsx .github/workflows/one-shot-admin-ulsan-full-load.yml
          git commit -m 'fix: show all Ulsan intersections in ground truth admin'
          git push origin main
